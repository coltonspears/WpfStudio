name: Diagnose the debugger launch

# Temporary: traces every DAP session and netcoredbg's own log, and samples the busiest processes, to see why
# configurationDone fails with E_FAIL for the net8 and net9 fixtures on some runs. Removed once that is understood.
on:
  push:
    branches: [claude/kind-thompson-dq7hnh]

permissions:
  contents: read

concurrency:
  group: diagnose-debugger-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  runtime:
    name: Runtime suite (${{ matrix.desktop }} desktop, ${{ matrix.attempt }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        desktop: [large, default]
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Describe the CPU
        shell: pwsh
        run: (Get-CimInstance Win32_Processor).Name
      - name: Give the desktop the size the shell smoke test lays out
        if: matrix.desktop == 'large'
        shell: pwsh
        run: ./tools/Set-DesktopSize.ps1 -Width 1920 -Height 1080
      - name: Download the pinned debugger
        shell: pwsh
        run: ./tools/Get-Debugger.ps1
      - name: Trace the DAP traffic and turn on netcoredbg's logs
        run: git apply .github/diagnostics/debugger.patch
      - name: Build
        run: dotnet build tests/WpfStudio.Runtime.Tests --configuration Release -p:TreatWarningsAsErrors=false
      - name: Runtime tests, four times
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Process pwsh -ArgumentList '-NoProfile', '-File', '.github/diagnostics/sample-processes.ps1', '-Path', "$PWD/samples.log" -WindowStyle Hidden
          foreach ($run in 1..4) {
            dotnet test tests/WpfStudio.Runtime.Tests --configuration Release --no-build --logger trx --results-directory "TestResults/runtime-$run"
          }
      - name: What the debugger sessions did
        if: always()
        shell: pwsh
        run: ./.github/diagnostics/report-debugger.ps1

  # The same steps as ci.yml, traced: the launch failed in the whole run, after the other suites.
  ci:
    name: CI as it runs, traced
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Describe the CPU
        shell: pwsh
        run: (Get-CimInstance Win32_Processor).Name
      - name: Give the desktop the size the shell smoke test lays out
        shell: pwsh
        run: ./tools/Set-DesktopSize.ps1 -Width 1920 -Height 1080
      - name: Restore
        run: dotnet restore WpfStudio.sln
      - name: Download the pinned debugger
        shell: pwsh
        run: ./tools/Get-Debugger.ps1
      - name: Trace the DAP traffic and turn on netcoredbg's logs
        run: git apply .github/diagnostics/debugger.patch
      - name: Build
        run: dotnet build WpfStudio.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=false
      - name: Test
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Process pwsh -ArgumentList '-NoProfile', '-File', '.github/diagnostics/sample-processes.ps1', '-Path', "$PWD/samples.log" -WindowStyle Hidden
          dotnet test WpfStudio.sln --configuration Release --no-build -m:1 --logger trx --results-directory TestResults
      - name: What the debugger sessions did
        if: always()
        shell: pwsh
        run: ./.github/diagnostics/report-debugger.ps1
