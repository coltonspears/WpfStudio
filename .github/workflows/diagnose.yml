name: Diagnose CI failures

# Temporary: describes the runner and repeats the suites whose tests fail on GitHub's runners, with the tracing in
# .github/diagnostics/trace.patch applied, and prints what the traces say about each failure. Removed once CI passes.
on:
  push:
    branches: [claude/kind-thompson-dq7hnh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Line model 4.0.0 against golden.json on whichever CPU each runner has; three runners make an AVX2-only one likely.
  codeassist:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Describe the CPU
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          $leaf7 = [System.Runtime.Intrinsics.X86.X86Base]::CpuId(7, 0)
          "CPU: $($cpu.Name); AVX512F $([System.Runtime.Intrinsics.X86.Avx512F]::IsSupported), AVX512-VNNI $(($leaf7.Item3 -band 0x800) -ne 0), AMX $(($leaf7.Item4 -band 0x1000000) -ne 0)"
      - name: Report
        shell: pwsh
        run: |
          git apply .github/diagnostics/trace.patch
          if ($LASTEXITCODE -ne 0) { throw "The tracing patch no longer applies." }
          dotnet build tests/WpfStudio.CodeAssist.Tests --configuration Release -p:TreatWarningsAsErrors=false
          dotnet test tests/WpfStudio.CodeAssist.Tests --configuration Release --no-build --filter "FullyQualifiedName~ScratchParityReport" --logger "console;verbosity=detailed"

  diagnose:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Describe the runner
        shell: pwsh
        run: |
          $cpu = Get-CimInstance Win32_Processor
          "CPU: $($cpu.Name); $($cpu.NumberOfCores) cores, $($cpu.NumberOfLogicalProcessors) logical"
          "AVX2 $([System.Runtime.Intrinsics.X86.Avx2]::IsSupported), AVX-VNNI $([System.Runtime.Intrinsics.X86.AvxVnni]::IsSupported), AVX512F $([System.Runtime.Intrinsics.X86.Avx512F]::IsSupported)"
          "Memory: $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)) GB"
          $principal = [Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()
          "User: $(whoami); administrator: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)); session $((Get-Process -Id $PID).SessionId); interactive $([Environment]::UserInteractive)"
          Get-CimInstance Win32_VideoController | ForEach-Object { "Video: $($_.Name) $($_.CurrentHorizontalResolution)x$($_.CurrentVerticalResolution)" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "Screen $($_.DeviceName): bounds $($_.Bounds), work area $($_.WorkingArea), primary $($_.Primary)" }
          Get-ItemProperty 'HKCU:\Control Panel\Desktop' -Name LogPixels -ErrorAction SilentlyContinue | ForEach-Object { "LogPixels $($_.LogPixels)" }
          Get-ItemProperty 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name AppliedDPI -ErrorAction SilentlyContinue | ForEach-Object { "AppliedDPI $($_.AppliedDPI)" }
          foreach ($key in 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}') {
            Get-ItemProperty $key -ErrorAction SilentlyContinue | ForEach-Object { "WebView2 runtime at ${key}: $($_.pv)" }
          }
          foreach ($key in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\EdgeUpdate') {
            if (Test-Path $key) { Get-ChildItem $key -Recurse | ForEach-Object { "Policy $($_.Name)"; $_ | Get-ItemProperty | Format-List | Out-String } ; Get-ItemProperty $key | Format-List | Out-String }
          }
          Get-ChildItem env: | Where-Object Name -like 'WEBVIEW2*' | ForEach-Object { "env $($_.Name)=$($_.Value)" }
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -ErrorAction SilentlyContinue | ForEach-Object { "EdgeWebView: $($_.Name)" }
          try { Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List | Out-String } catch { "Defender: $($_.Exception.Message)" }

      - name: Give the desktop the size the shell smoke test lays out
        shell: pwsh
        run: ./tools/Set-DesktopSize.ps1 -Width 1920 -Height 1080

      - name: Restore
        run: dotnet restore WpfStudio.sln

      - name: Download the pinned debugger
        shell: pwsh
        run: ./tools/Get-Debugger.ps1

      - name: Apply the tracing
        shell: pwsh
        run: |
          git apply .github/diagnostics/trace.patch
          if ($LASTEXITCODE -ne 0) { throw "The tracing patch no longer applies." }
          git diff --stat

      - name: Build
        run: dotnet build WpfStudio.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=false

      - name: Code Assist
        continue-on-error: true
        shell: pwsh
        run: dotnet test tests/WpfStudio.CodeAssist.Tests --configuration Release --no-build --logger trx --results-directory TestResults/codeassist

      - name: Shell smoke
        continue-on-error: true
        shell: pwsh
        env:
          WPFSTUDIO_DIAG_TRACE: ${{ runner.temp }}\trace-smoke
        run: |
          New-Item -ItemType Directory -Force $env:WPFSTUDIO_DIAG_TRACE | Out-Null
          dotnet test tests/WpfStudio.App.Tests --configuration Release --no-build --logger "console;verbosity=detailed" --logger trx --results-directory TestResults/smoke

      - name: Runtime suite, twice
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = 0
          foreach ($run in 1..2) {
            $env:WPFSTUDIO_DIAG_TRACE = "$env:RUNNER_TEMP\trace-runtime-$run"
            New-Item -ItemType Directory -Force $env:WPFSTUDIO_DIAG_TRACE | Out-Null
            dotnet test tests/WpfStudio.Runtime.Tests --configuration Release --no-build --logger trx --results-directory "TestResults/runtime-$run"
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Inspection suite, twice
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = 0
          foreach ($run in 1..2) {
            dotnet test tests/WpfStudio.Inspection.Tests --configuration Release --no-build --logger trx --results-directory "TestResults/inspection-$run"
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { exit 1 }

      - name: Shell suite, four times
        continue-on-error: true
        shell: pwsh
        run: |
          $failed = 0
          foreach ($run in 1..4) {
            $env:WPFSTUDIO_DIAG_TRACE = "$env:RUNNER_TEMP\trace-shell-$run"
            New-Item -ItemType Directory -Force $env:WPFSTUDIO_DIAG_TRACE | Out-Null
            dotnet test tests/WpfStudio.Shell.Tests --configuration Release --no-build --logger trx --results-directory "TestResults/shell-$run"
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { exit 1 }

      - name: What the traces say
        if: always()
        shell: pwsh
        run: |
          foreach ($trx in Get-ChildItem TestResults -Recurse -Filter *.trx) {
            $xml = [xml](Get-Content $trx.FullName -Raw)
            $results = $xml.TestRun.Results.UnitTestResult
            $failures = @($results | Where-Object outcome -eq 'Failed')
            "== $($trx.Directory.Name): $(@($results).Count) results, $($failures.Count) failed"
            foreach ($failure in $failures) { "   FAILED $($failure.testName) ($($failure.duration)): $($failure.Output.ErrorInfo.Message)" }
          }
          foreach ($folder in Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'trace-*') {
            "==================== $($folder.Name)"
            $files = Get-ChildItem $folder.FullName -Filter 'trace.*.log'
            foreach ($file in $files) {
              $lines = Get-Content $file.FullName
              # Markers and lines from the terminal, debugger output and attach tests are short; print them whole.
              $lines | Where-Object { $_ -match '\] TEST |terminal |output buffer' } | Select-Object -First 200
              # Each marked Shell test: every line of its workspace, and of its worker.
              $marked = $lines | Select-String -Pattern '\] TEST (\w+) ws(\d+) start' | ForEach-Object { [pscustomobject]@{ Test = $_.Matches[0].Groups[1].Value; Ws = $_.Matches[0].Groups[2].Value } }
              foreach ($mark in $marked) {
                "---------- $($mark.Test) (ws$($mark.Ws)) in $($file.Name)"
                $own = $lines | Where-Object { $_ -match "ws$($mark.Ws) " }
                $own | Select-Object -Last 400
                $worker = $own | Select-String -Pattern "worker started pid (\d+)" | Select-Object -First 1
                if ($worker) {
                  $workerFile = Join-Path $folder.FullName "trace.$($worker.Matches[0].Groups[1].Value).log"
                  if (Test-Path $workerFile) { "  worker:"; Get-Content $workerFile | Select-Object -Last 100 }
                }
              }
            }
          }
