name: Release

# Publishes a GitHub release of the version in Version.props: Actions > Release > Run workflow, or
#   gh workflow run release.yml -f prerelease=false
# It builds the portable package twice, for the installed .NET 10 Desktop runtime and self-contained, and attaches both
# with their SHA-256 hashes. Help > Check for updates in WpfStudio installs the newest release that is not a draft or
# a pre-release. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark it as a pre-release. Help > Check for updates does not offer pre-releases.
        type: boolean
        default: false
      draft:
        description: Save it as a draft to review before publishing. Nobody is offered a draft until it is published.
        type: boolean
        default: false
      run-tests:
        description: Run the test suites before packaging.
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build and publish the release
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install the .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read the version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ./tools/Get-Version.ps1
          $tag = "v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "$tag is already released. Merge a pull request to raise the version, or run tools/Bump-Version.ps1 in one." }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "A release named $tag already exists, perhaps as a draft. Publish or delete it first." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish for the installed .NET runtime
        shell: pwsh
        env:
          RUN_TESTS: ${{ inputs.run-tests }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $options = @{ Zip = $true; ReleaseRepository = $env:GITHUB_REPOSITORY }
          if ($env:RUN_TESTS -ne 'true') { $options.SkipTests = $true }
          ./tools/Publish.ps1 @options
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Move-Item -LiteralPath artifacts/WpfStudio-win-x64.zip -Destination "release/WpfStudio-$env:VERSION-win-x64.zip"

      - name: Publish self-contained
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./tools/Publish.ps1 -Zip -SelfContained -SkipTests -SkipDebuggerDownload -ReleaseRepository $env:GITHUB_REPOSITORY
          Move-Item -LiteralPath artifacts/WpfStudio-win-x64.zip -Destination "release/WpfStudio-$env:VERSION-win-x64-self-contained.zip"

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath release -Filter *.zip | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path release) 'SHA256SUMS.txt'), [string[]]$lines)
          Get-Content release/SHA256SUMS.txt

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          $files = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          $options = @('--target', $env:GITHUB_SHA, '--title', "WpfStudio $env:VERSION", '--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $options += '--prerelease' }
          if ($env:DRAFT -eq 'true') { $options += '--draft' }
          gh release create $env:TAG @files @options
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          $url = gh release view $env:TAG --json url --jq .url
          "Released [WpfStudio $env:VERSION]($url)." >> $env:GITHUB_STEP_SUMMARY
